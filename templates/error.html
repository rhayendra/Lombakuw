{% extends "base.html" %}
{% block title %}{{ code }} — Lombaku{% endblock %}

{% block content %}
<div class="glass-panel card-pad" style="max-width:560px;margin:48px auto;text-align:center;">
  <div style="font-size:3.2rem;font-weight:700;letter-spacing:-0.04em;color:var(--accent-cyan);line-height:1;">{{ code }}</div>
  <h1 style="margin:12px 0 8px;font-size:1.5rem;">{{ title }}</h1>
  <p style="color:var(--text-secondary);margin:0 0 22px;">{{ message }}</p>
  <a href="{{ url_for('public.home') }}" class="btn-glass btn-primary">Kembali ke Beranda</a>
</div>
{% endblock %}
